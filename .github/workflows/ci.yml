name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # postinstall builds native addons for Electron; rebuild for system Node so vitest can load them
      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Node
        run: npm rebuild better-sqlite3 sharp

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
